<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/flex04.css">
    <style>
        .container{
         display: flex;
         background-color: rgb(93, 223, 179);
         height: 200px;
         gap: 10px;
         align-items: center;   
        }
        .box{
            background-color: rgb(48, 170, 133);
        }
        .box2{
            border:1px solid rgb(58, 57, 57);
            align-self: flex-end;
        }
    </style>
    <title>flex 영역 연습</title>
</head>
<body>
    <div class="container">
    <div class="box">박스1</div>
    <div class="box box2">박스2</div>
    <div class="box">박스3</div>
    </div>
</body>
</html>
