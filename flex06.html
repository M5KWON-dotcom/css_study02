<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/flex06.css">
    <title>상품카드만들기 예제
    </title>
</head>
<body>
    <h1>인기상품</h1>
    <div class="product-list">

        <div class="product">
            <div class="image-box">
            <img src="img/headphone.png" alt="무선 헤드폰">
            </div>
            <p class="product-name">무선 헤드폰</p>
            <div class="product-price">59,000원</div>
            <a href="#" class="buy-button">구매하기</a>
        </div>

        <div class="product">
            <div class="image-box">
            <img src="img/mouse.png" alt="무선 마우스">
            </div>
            <p class="product-name">무선 마우스</p>
            <div class="product-price">29,000원</div>
            <a href="#" class="buy-button">구매하기</a>
        </div>
    </div>

    
</body>
</html>
